name: Keep Websites Awake

on:
  schedule:
    # GitHub Actions uses UTC time. Vietnam Time is UTC+7.
    # 7:30am, 8:30am, 9:30am, 10:30am, 12:30pm, 1:30pm, 2:30pm, 3:30pm, 4:30pm, 5:30pm ICT
    - cron: '30 0,1,2,3,5,6,7,8,9,10 * * *'
    # 8:00pm ICT
    - cron: '0 13 * * *'
  
  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Traffic Shop
        run: curl -sSf https://traffic-shop.vercel.app/product-list > /dev/null || echo "Traffic Shop ping failed"

      - name: Ping The Blog
        run: curl -sSf https://theblog-nvhnam.vercel.app/home > /dev/null || echo "The Blog ping failed"

      - name: Ping Food Detector
        run: curl -sSf https://fooddetectorv2.streamlit.app/ > /dev/null || echo "Food Detector ping failed"
