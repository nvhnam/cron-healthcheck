name: Keep Websites Awake

on:
  schedule:
    # GitHub Actions uses UTC time. Vietnam Time is UTC+7.
    # 7:30am, 8:30am, 9:30am, 10:30am, 12:30pm, 1:30pm, 2:30pm, 3:30pm, 4:30pm, 5:30pm ICT
    - cron: '30 0,1,2,3,5,6,7,8,9,10 * * *'
    # 8:00pm ICT
    - cron: '0 13 * * *'
  
  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Traffic Shop Backend
        run: curl -sL -w "Status %{http_code} from %{url_effective}\n" -o /dev/null "https://food-visualizer-backend.vercel.app/product-with-nutrients?fat=all&saturates=all&sugars=all&salt=all&category=All&currentPage=1&limit=1"

      - name: Ping The Blog Backend
        run: curl -sL -w "Status %{http_code} from %{url_effective}\n" -o /dev/null "https://theblog-backend-v1-0.onrender.com/posts/all/paginated?page=0&size=5"

      - name: Ping Food Detector
        run: curl -s -w "Status %{http_code} from %{url_effective}\n" -o /dev/null https://fooddetectorv2.streamlit.app/

      - name: Ping MySQL Agent
        run: curl -s -w "Status %{http_code} from %{url_effective}\n" -o /dev/null https://mysqlagent.streamlit.app/
